<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d">
<title id="t">Alberto Quirce — webs animadas y automatizaciones con IA</title>
<desc id="d">Banner cartoon rosa con el nombre Alberto Quirce y un prisma sonriente que refracta un rayo de luz en un espectro de colores.</desc>
<style>

.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.wave{transform-box:fill-box;transform-origin:10% 90%;animation:wave 1.2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(22deg)}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0deg);opacity:.5}50%{transform:scale(1) rotate(45deg);opacity:1}}

.ray{transform-box:fill-box;transform-origin:left center;animation:ray 2.4s ease-in-out infinite}
@keyframes ray{0%,100%{transform:scaleY(.8);opacity:.85}50%{transform:scaleY(1.15);opacity:1}}
.beam{animation:beam 2.4s ease-in-out infinite}
@keyframes beam{0%,100%{opacity:.75}50%{opacity:1}}
.wig{transform-box:fill-box;transform-origin:center;animation:wig 2.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
.ty0{transform-box:fill-box;transform:translateX(112%);animation:ty0 9s steps(40,end) infinite}
@keyframes ty0{0%,0.00%{transform:translateX(0)}35.56%,100%{transform:translateX(112%)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
