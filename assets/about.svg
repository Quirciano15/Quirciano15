<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
<title id="t">Quién soy: Alberto, webs que se mueven y automatizaciones con IA</title>
<desc id="d">Un robot de metal con antena saluda dentro de una viñeta de cómic donde se teclea: Hola, soy Alberto. Hago webs que se mueven y automatizaciones con IA para negocios de verdad. Madrid, Next.js, Three.js, Claude.</desc>
