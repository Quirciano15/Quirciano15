<title id="t">Filarmonic: corrector de armonía y blog de música — correctorarmonia.com</title>
<desc id="d">Tarjeta azul con un pentagrama por el que desfilan notas, un acorde que se ilumina nota a nota y un sello verde de corregido. Texto: Corrector de ejercicios de armonía SATB y blog de teoría, práctica y equipo. Botón verde: correctorarmonia.com.</desc>
