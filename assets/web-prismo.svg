<title id="t">Prismo: webs y automatizaciones con IA para pequeños negocios — prismo.digital</title>
<desc id="d">Tarjeta rosa con el prisma sonriente de Prismo. Texto: Ponemos tu negocio en internet. Tú no tienes que entender nada. Botón verde: prismo.digital.</desc>
<style>

.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.wave{transform-box:fill-box;transform-origin:10% 90%;animation:wave 1.2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(22deg)}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0deg);opacity:.5}50%{transform:scale(1) rotate(45deg);opacity:1}}

.cta{transform-box:fill-box;transform-origin:center;animation:cta 2.6s ease-in-out infinite}
@keyframes cta{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}
.ray{transform-box:fill-box;transform-origin:left center;animation:ray 2.4s ease-in-out infinite}
@keyframes ray{0%,100%{transform:scaleY(.8);opacity:.8}50%{transform:scaleY(1.15);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
